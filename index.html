  <!-- Script de Audio Player Global -->
  <script>
    // AudioPlayer unificado
    class AudioPlayer {
      constructor() {
        this.audio = null;
        this.isPlaying = false;
        this.volume = 0.3;
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;

        this.audio = document.createElement('audio');
        this.audio.id = 'backgroundMusic';
        this.audio.loop = true;
        this.audio.volume = this.volume;
        this.audio.preload = 'auto';

        this.audio.src = '/audio/background-music.mp3';

        document.body.appendChild(this.audio);

        this.audio.addEventListener('canplaythrough', () => {
          console.log('✅ Audio cargado y listo para reproducir');
        });

        this.audio.addEventListener('error', (e) => {
          console.error('❌ Error al cargar el audio:', e);
        });

        this.audio.addEventListener('play', () => {
          console.log('🎵 Audio reproduciendo');
          this.isPlaying = true;
          this.updateUI();
        });

        this.audio.addEventListener('pause', () => {
          console.log('⏸️ Audio pausado');
          this.isPlaying = false;
          this.updateUI();
        });

        this.initialized = true;
        console.log('✅ AudioPlayer inicializado correctamente');
      }

      play() {
        if (!this.initialized) {
          this.init();
        }

        if (this.audio) {
          const playPromise = this.audio.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                this.isPlaying = true;
                console.log('🎵 Reproduciendo música');
                this.updateUI();
              })
              .catch(error => {
                console.error('❌ Error al reproducir:', error);
                this.isPlaying = false;
                this.updateUI();
              });
          }
        }
      }

      pause() {
        if (this.audio) {
          this.audio.pause();
          this.isPlaying = false;
          console.log('⏸️ Música pausada');
          this.updateUI();
        }
      }

      togglePlay() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      }

      setVolume(volume) {
        if (this.audio) {
          this.volume = Math.max(0, Math.min(1, volume));
          this.audio.volume = this.volume;
        }
      }

      updateUI() {
        const event = new CustomEvent('audioStateChange', {
          detail: { isPlaying: this.isPlaying }
        });
        window.dispatchEvent(event);
      }

      getState() {
        return {
          playing: this.isPlaying,
          volume: this.volume,
          initialized: this.initialized
        };
      }
    }

    // Crear instancia global disponible para React
    window.audioPlayer = new AudioPlayer();
    console.log('🎵 Sistema de audio cargado - window.audioPlayer disponible');

    // Detectar y guardar preferencia de idioma
    (function () {
      const savedLang = localStorage.getItem('preferred-language');
      const browserLang = navigator.language || navigator.userLanguage;
      const defaultLang = 'es';

      if (!savedLang) {
        const supportedLangs = ['es', 'en'];
        const detectedLang = supportedLangs.includes(browserLang.split('-')[0])
          ? browserLang.split('-')[0]
          : defaultLang;
        localStorage.setItem('preferred-language', detectedLang);
      }
    })();
  </script>
