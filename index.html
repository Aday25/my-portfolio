    <!-- Script de Audio Player Global -->
    <script>
      class AudioPlayer {
        constructor() {
          this.audio = null;
          this.isPlaying = false;
          this.volume = 0.3;
          this.initialized = false;
        }

        init() {
          if (this.initialized) return;

          this.audio = document.createElement('audio');
          this.audio.id = 'backgroundMusic';
          this.audio.loop = true;
          this.audio.volume = this.volume;
          this.audio.preload = 'auto';
          this.audio.src = '/audio/background-music.mp3';
          
          document.body.appendChild(this.audio);

          this.audio.addEventListener('canplaythrough', () => {
            console.log('✅ Audio listo');
          });

          this.audio.addEventListener('error', (e) => {
            console.error('❌ Error audio:', e);
          });

          this.audio.addEventListener('play', () => {
            this.isPlaying = true;
            this.updateUI();
          });

          this.audio.addEventListener('pause', () => {
            this.isPlaying = false;
            this.updateUI();
          });

          this.initialized = true;
        }

        play() {
          if (!this.initialized) this.init();
          if (this.audio) {
            this.audio.play()
              .then(() => {
                this.isPlaying = true;
                this.updateUI();
              })
              .catch(error => {
                console.error('Error play:', error);
                this.isPlaying = false;
                this.updateUI();
              });
          }
        }

        pause() {
          if (this.audio) {
            this.audio.pause();
            this.isPlaying = false;
            this.updateUI();
          }
        }

        togglePlay() {
          this.isPlaying ? this.pause() : this.play();
        }

        setVolume(volume) {
          if (this.audio) {
            this.volume = Math.max(0, Math.min(1, volume));
            this.audio.volume = this.volume;
          }
        }

        updateUI() {
          window.dispatchEvent(new CustomEvent('audioStateChange', {
            detail: { isPlaying: this.isPlaying }
          }));
        }

        getState() {
          return {
            playing: this.isPlaying,
            volume: this.volume,
            initialized: this.initialized
          };
        }
      }

      window.audioPlayer = new AudioPlayer();

      // Detectar idioma
      (function() {
        const savedLang = localStorage.getItem('preferred-language');
        if (!savedLang) {
          const browserLang = (navigator.language || 'es').split('-')[0];
          const lang = ['es', 'en'].includes(browserLang) ? browserLang : 'es';
          localStorage.setItem('preferred-language', lang);
        }
      })();
    </script>
